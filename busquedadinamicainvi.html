<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Búsqueda dinámica · AUXBROKER</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <h1>🔍 Búsqueda dinámica</h1>

  <!-- Formulario -->
  <form id="formBusqueda">
    <select id="tipoRequerimiento">
      <option value="solicita">Solicita</option>
      <option value="ofrece">Ofrece</option>
    </select>
    <select id="inmueble"></select>
    <select id="tipoOperacion"></select>
    <input type="number" id="precioMin" placeholder="Desde">
    <input type="number" id="precioMax" placeholder="Hasta">
    <select id="municipio"></select>
    <button type="button" id="btnBuscar">Buscar opciones</button>
  </form>

  <!-- Resultados -->
  <div id="resultadosBusqueda"></div>

  <!-- Script -->
  <script type="module">
    import { supabase } from "./js/supabaseClient.js";
    import { loadPartial } from "./js/utils.js";
    import { mostrarOpcionesContactoInvitado } from "./js/contact-utils-invi.js";

    // Cargar partials
    loadPartial("inmuebleBox", "./inmueble.html");
    loadPartial("municipioBox", "./municipio.html");

    let resultadosBase = [], resultadosActuales = [];

    // Buscar
    document.getElementById("btnBuscar").addEventListener("click", async () => {
      const tipoReq = (document.getElementById("tipoRequerimiento").value === "solicita") ? "solicitud" : "ofrecimiento";
      const inmueble = document.getElementById("inmueble")?.value || "";
      const operacion = document.getElementById("tipoOperacion")?.value || "";
      const municipio = document.getElementById("municipio")?.value || "";
      const precioMin = parseFloat(document.getElementById("precioMin").value) || 0;
      const precioMax = parseFloat(document.getElementById("precioMax").value) || Number.MAX_SAFE_INTEGER;

      let query = supabase.from("bolsa").select("*")
        .eq("estado","activa").eq("requerimiento",tipoReq)
        .eq("inmueble",inmueble).eq("operacion",operacion);

      if (municipio && municipio.toLowerCase() !== "na") query = query.eq("municipio", municipio);

      const { data: resultados, error } = await query.order("id",{ascending:false});
      const contenedor = document.getElementById("resultadosBusqueda");
      contenedor.innerHTML = "";

      if (error) return contenedor.innerHTML="<p>Error al ejecutar búsqueda.</p>";
      if (!resultados?.length) return contenedor.innerHTML="<p>No se encontraron coincidencias.</p>";

      resultadosBase = resultados.filter(item=>{
        const min=parseFloat(item.preciomin)||0, max=parseFloat(item.preciomax)||0;
        const rango=min>=precioMin && (max?max<=precioMax:true);
        const abierto=tipoReq==="solicitud" && min===1111 && max===1111;
        return rango||abierto;
      });
      resultadosActuales=[...resultadosBase];
      mostrarResultados(resultadosActuales);
    });

    // Filtrar palabra clave
    function aplicarFiltroPalabra(palabra){
      const clave=palabra.trim().toLowerCase();
      resultadosActuales=!clave?[...resultadosBase]:resultadosActuales.filter(i=>i.masdetalle.toLowerCase().includes(clave));
      mostrarResultados(resultadosActuales);
    }

    // Mostrar resultados
    function mostrarResultados(lista){
      const cont=document.getElementById("resultadosBusqueda");
      cont.innerHTML="";
      if (!lista?.length) return cont.innerHTML="<p>No se encontraron opciones con los filtros aplicados.</p>";

      const filtro=document.createElement("div");
      filtro.className="filtro-palabra";
      const input=document.createElement("input"); input.type="text"; input.placeholder="Filtrar por palabra clave";
      const btn=document.createElement("button"); btn.textContent="🔍 Filtrar";
      btn.addEventListener("click",()=>aplicarFiltroPalabra(input.value));
      filtro.append(input,btn); cont.appendChild(filtro);

      lista.forEach(item=>{
        const min=parseFloat(item.preciomin)||0, max=parseFloat(item.preciomax)||0;
        const abierto=min===1111 && max===1111;
        const card=document.createElement("div");
        card.className="card";
        card.innerHTML=`
          <p><strong>Detalle:</strong> ${item.masdetalle||""}</p>
          <p><strong>Fecha:</strong> ${item.fecha_alta||"Sin fecha"}</p>
          <p><em>${abierto?"Presupuesto abierto":"En el rango"}</em></p>
          <button class="btn-contactar">Contactar</button>`;
        card.querySelector(".btn-contactar").addEventListener("click",()=>{
          mostrarOpcionesContactoInvitado(card,item.telefono,item.pais,item.masdetalle,item.id);
        });
        cont.appendChild(card);
      });
    }
  </script>
</body>
</html>
