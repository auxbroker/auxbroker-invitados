<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AUXBROKER · Búsqueda dinámica (Invitado)</title>
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
  <header>
    <h1>AUXBROKER MONTERREY · Invitado</h1>
  </header>

  <main>
    <div id="datosInvitado" class="card"></div>

    <section id="busquedaDinamica" class="card">
      <h2>🔎 Búsqueda dinámica</h2>
      <p>
        Busco quien 
        <select id="tipoRequerimiento" required>
          <option value="">Seleccione requerimiento</option>
          <option value="solicita">solicita</option>
          <option value="ofrece">ofrece</option>
        </select>
        <span id="inmuebleBox"></span>
        en 
        <select id="tipoOperacion" required>
          <option value="">Seleccione operación</option>
          <option value="renta">renta</option>
          <option value="venta">venta</option>
        </select>
        con precio entre 
        <input type="text" id="precioMin" placeholder="desde"> y 
        <input type="text" id="precioMax" placeholder="hasta">
        en el 
        <span id="municipioBox"></span>
      </p>

      <button id="btnBuscar">Buscar opciones</button>
      <div id="resultadosBusqueda"></div>
    </section>
  </main>

  <script type="module">
    // Recuperar datos del invitado
    const nombre = sessionStorage.getItem("nombre");
    const telefono = sessionStorage.getItem("telefono");
    const cupos = sessionStorage.getItem("cupos");
    const plan = sessionStorage.getItem("plan");

    if (plan !== "invitado") {
      alert("Acceso restringido. Solo invitados.");
      window.location.href = "login-invitado.html";
    }

    document.getElementById("datosInvitado").innerHTML = `
      <p><strong>Invitado autenticado:</strong> ${nombre}</p>
      <p><strong>Teléfono:</strong> ${telefono}</p>
      <p><strong>Cupos disponibles:</strong> ${cupos}</p>
    `;
  </script>

  <!-- Script principal replicado -->
  <script type="module" src="../js/busquedadinamicainvi.js"></script>
</body>
</html>
